version: "1.0"
services:
  frontend:
    build: "./frontend"
    container_name: library-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
        - /app/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: library_backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
